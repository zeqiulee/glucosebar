name: Build GlucoseBar
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional draft prerelease tag, for example v0.7.0-beta.1 (main only)'
        required: false
        default: ''
        type: string
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@v4
      - name: Test and package architecture-specific preview
        env:
          GLUCOSEBAR_ARCH: ${{ matrix.arch }}
          GLUCOSEBAR_RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag || '' }}
        run: |
          python3 scripts/check-public-content.py
          ./scripts/test-core.sh
          ./scripts/package-release.sh ./dist
      - uses: actions/upload-artifact@v4
        with:
          name: GlucoseBar-macOS-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
  release:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release_tag != '')
    needs: macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check release tag against VERSION
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
        shell: bash
        run: |
          task_version="$(tr -d '[:space:]' < VERSION)"
          task_version_pattern="${task_version//./\\.}"
          [[ "$RELEASE_TAG" =~ ^v${task_version_pattern}(-beta\.[1-9][0-9]*)?$ ]] || { printf 'Tag does not match VERSION.\n' >&2; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          pattern: GlucoseBar-macOS-*
          path: dist
          merge-multiple: true
      - name: Verify checksums
        run: cd dist && sha256sum -c ./*.sha256
      - name: Prepare draft prerelease for maintainer review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
        shell: bash
        run: |
          task_tag_args=(--verify-tag)
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            # A fresh tag prevents attaching newly built assets to a different existing revision.
            task_existing_tag="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")"
            [[ -z "$task_existing_tag" ]] || { printf 'Manual release requires a new tag.\n' >&2; exit 1; }
            task_tag_args=(--target "$GITHUB_SHA")
          fi
          gh release create "$RELEASE_TAG" dist/*.zip dist/*.sha256 --title "GlucoseBar $RELEASE_TAG" --draft --prerelease --generate-notes "${task_tag_args[@]}"
